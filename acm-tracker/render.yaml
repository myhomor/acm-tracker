databases:
  - name: acm-tracker-db
    databaseName: acm_tracker
    user: acm
    plan: free

services:
  - type: web
    name: acm-tracker
    runtime: image
    image:
      url: ghcr.io/harrinson-gutierrez/acm-tracker:latest
    plan: starter
    healthCheckPath: /api/projects
    disk:
      name: acm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: acm-tracker-db
          property: connectionString
      - key: PORT
        value: "5173"
      - key: API_PORT
        value: "5173"
      - key: OWNER_NAME
        value: Harry G.
      - key: OWNER_EMAIL
        value: owner@acm.local
      - key: OWNER_RATE_PER_HOUR
        value: "45"
