services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: ${API_PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      UPLOADS_DIR: /repo/apps/api/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./uploads:/repo/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4000}/api
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
