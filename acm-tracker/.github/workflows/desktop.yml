name: Desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Assemble sidecar payload
        run: pnpm --filter @acm/desktop prepare:payload

      # Code signing (TODO — requires paid certificates, left unconfigured on purpose):
      #   Windows Authenticode: set TAURI_SIGNING_PRIVATE_KEY / cert via signtool in tauri.conf.json `bundle.windows`.
      #   macOS notarization: set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as repo secrets (consumed by tauri-action automatically).
      #   Tauri auto-updater: set TAURI_SIGNING_PRIVATE_KEY + plugin-updater wiring to GitHub Releases.
      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "ACM-TRACKER Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
