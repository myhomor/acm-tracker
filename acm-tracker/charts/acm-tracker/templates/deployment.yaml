apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acm-tracker.fullname" . }}
  labels:
    {{- include "acm-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "acm-tracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acm-tracker.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: acm-tracker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: DB_BACKEND
              value: {{ .Values.db.backend | quote }}
            {{- if eq .Values.db.backend "sqlite" }}
            - name: DATABASE_URL
              value: {{ .Values.db.sqlite.path | quote }}
            {{- else }}
            {{- if .Values.db.postgres.urlSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.postgres.urlSecret.name }}
                  key: {{ .Values.db.postgres.urlSecret.key }}
            {{- else }}
            - name: DATABASE_URL
              value: {{ required "db.postgres.url is required when db.backend=postgres and no urlSecret is set" .Values.db.postgres.url | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.cors.origin }}
            - name: CORS_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            - name: UPLOADS_DIR
              value: /data/uploads
            - name: OWNER_NAME
              value: {{ .Values.owner.name | quote }}
            - name: OWNER_EMAIL
              value: {{ .Values.owner.email | quote }}
            - name: OWNER_RATE_PER_HOUR
              value: {{ .Values.owner.ratePerHour | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/projects
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/projects
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "acm-tracker.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
