image:
  repository: ghcr.io/harrinson-gutierrez/acm-tracker
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

db:
  backend: sqlite
  sqlite:
    path: file:/data/acm.db
  postgres:
    url: ""
    urlSecret:
      name: ""
      key: databaseUrl

cors:
  origin: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: acm-tracker.local
  tls:
    enabled: false
    secretName: ""

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

owner:
  name: "Harry G."
  email: owner@acm.local
  ratePerHour: "45"

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
